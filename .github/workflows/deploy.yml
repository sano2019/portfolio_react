name: Deploy Vite React TS Site

on:
  push:
    branches:
      - master # Change to main if your default branch is named main
  schedule:
    - cron: "0 0 1,15 * *" # Automates a fresh fetch/deploy every 2 weeks
  workflow_dispatch: # Allows you to manually trigger a fresh build inside GitHub anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      # ⚡ CRITICAL REPO TASK: Bakes your public data model right into the public folder
      # We run this BEFORE 'npm run build' so Vite packs the JSON layout into the /dist asset target
      - name: Fetch and Bake YouTube Data Feed
        run: node fetch-youtube.js

      - name: Compile and Bundle Site Build
        run: npm run build

      - name: Upload Static Build Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
